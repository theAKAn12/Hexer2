<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>HEXER · Persistent Real-Time Chat</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', 'Poppins', 'Inter', system-ui, sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 10% 20%, rgb(0, 0, 0) 0%, #0a0f1e 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .universe-card {
      width: 100%;
      max-width: 950px;
      background: rgba(12, 15, 28, 0.75);
      backdrop-filter: blur(16px);
      border-radius: 64px;
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.12);
      overflow: hidden;
      border: 1px solid rgba(88, 130, 255, 0.3);
    }

    .hexer-brand {
      text-align: center;
      padding: 28px 20px 12px 20px;
      background: linear-gradient(135deg, rgba(0, 0, 0, 0.2), rgba(20, 30, 55, 0.4));
      border-bottom: 1px solid rgba(72, 120, 255, 0.4);
    }

    .hexer-glow {
      font-size: 4.2rem;
      font-weight: 900;
      letter-spacing: 8px;
      background: linear-gradient(135deg, #FFFFFF, #a0b9ff, #4c7eff);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      text-shadow: 0 0 18px rgba(76, 126, 255, 0.4);
      animation: subtlePulse 3s infinite alternate;
    }

    @keyframes subtlePulse {
      0% { text-shadow: 0 0 5px rgba(76,126,255,0.2); letter-spacing: 8px; }
      100% { text-shadow: 0 0 20px rgba(76,126,255,0.7); letter-spacing: 10px; }
    }

    .hexer-tag {
      font-size: 0.7rem;
      text-transform: uppercase;
      color: #8d9eff;
      letter-spacing: 3px;
      margin-top: 8px;
    }

    .auth-container {
      padding: 28px 28px 38px;
    }

    .auth-tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 32px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 100px;
      padding: 6px;
    }

    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      padding: 12px 0;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 60px;
      cursor: pointer;
      color: #b9c3ff;
    }

    .tab-btn.active {
      background: #2d3eff;
      color: white;
      box-shadow: 0 5px 15px rgba(45, 62, 255, 0.4);
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-group label {
      font-weight: 600;
      color: #cfdcff;
      font-size: 0.8rem;
      letter-spacing: 1px;
    }

    .input-group input {
      padding: 14px 20px;
      border: 1.5px solid rgba(80, 110, 255, 0.4);
      border-radius: 48px;
      font-size: 1rem;
      background: rgba(0, 0, 0, 0.5);
      color: white;
      outline: none;
    }

    .input-group input:focus {
      border-color: #5f7eff;
      box-shadow: 0 0 0 3px rgba(95, 126, 255, 0.3);
    }

    .auth-btn {
      background: linear-gradient(95deg, #2d3eff, #6c4eff);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 60px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.2s;
    }

    .auth-btn:hover {
      transform: scale(0.98);
    }

    .auth-message {
      text-align: center;
      font-size: 0.8rem;
      padding: 10px;
      border-radius: 60px;
      background: rgba(255, 255, 255, 0.05);
      color: #b9ceff;
    }

    .error-msg { background: rgba(220, 38, 38, 0.25); color: #ffaeae; }
    .success-msg { background: rgba(34, 197, 94, 0.2); color: #b0ffc3; }

    .recipient-section {
      padding: 24px;
      background: rgba(10, 20, 40, 0.85);
      border-radius: 48px;
      margin-bottom: 24px;
      border: 1px solid rgba(72, 120, 255, 0.6);
    }

    .recipient-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: white;
      margin-bottom: 20px;
    }

    .recipient-fields {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .recipient-fields .input-group {
      flex: 1;
    }

    .validation-status {
      margin: 12px 0;
      font-size: 0.85rem;
    }

    .status-unavailable {
      color: #ff8888;
      background: rgba(200, 60, 60, 0.2);
      padding: 6px 12px;
      border-radius: 30px;
      display: inline-block;
    }

    .status-available {
      color: #88ffaa;
      background: rgba(80, 200, 80, 0.2);
      padding: 6px 12px;
      border-radius: 30px;
      display: inline-block;
    }

    .online-badge {
      background: #10b981;
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.7rem;
      margin-left: 10px;
    }

    .offline-badge {
      background: #6b7280;
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.7rem;
      margin-left: 10px;
    }

    .comms-container {
      display: none;
    }

    .chat-header {
      background: rgba(45, 62, 255, 0.2);
      border-radius: 60px;
      padding: 12px 20px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }

    .chat-messages {
      background: rgba(0, 0, 0, 0.4);
      border-radius: 32px;
      padding: 20px;
      height: 380px;
      overflow-y: auto;
      margin-bottom: 20px;
    }

    .message-bubble {
      margin-bottom: 16px;
      padding: 10px 16px;
      border-radius: 20px;
      max-width: 85%;
      word-wrap: break-word;
      position: relative;
      transition: all 0.2s;
    }

    .message-sent {
      background: #2d3eff;
      color: white;
      margin-left: auto;
      text-align: right;
    }

    .message-received {
      background: rgba(255, 255, 255, 0.1);
      color: #e0e0e0;
    }

    .reply-preview {
      background: rgba(0, 0, 0, 0.3);
      border-left: 3px solid #88ddff;
      padding: 6px 10px;
      margin-bottom: 8px;
      border-radius: 12px;
      font-size: 0.75rem;
      opacity: 0.8;
    }

    .reply-preview span {
      color: #88ddff;
      font-weight: bold;
    }

    .message-time {
      font-size: 0.65rem;
      opacity: 0.7;
      margin-top: 6px;
    }

    .seen-status {
      font-size: 0.6rem;
      opacity: 0.6;
      margin-top: 4px;
      text-align: right;
      font-style: italic;
    }

    .message-actions {
      position: absolute;
      bottom: 5px;
      right: 8px;
      display: flex;
      gap: 6px;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .message-bubble:hover .message-actions {
      opacity: 1;
    }

    .action-icon {
      background: rgba(0, 0, 0, 0.6);
      border: none;
      color: white;
      cursor: pointer;
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 20px;
      transition: 0.2s;
    }

    .action-icon:hover {
      background: #2d3eff;
    }

    .delete-icon:hover {
      background: #ef4444;
    }

    .inline-audio {
      margin-top: 6px;
      max-width: 250px;
    }

    .file-link {
      color: #88ddff;
      text-decoration: underline;
      cursor: pointer;
      display: inline-block;
      margin-top: 4px;
    }

    .file-link:hover {
      color: #ffffff;
    }

    .input-bar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      background: rgba(0, 0, 0, 0.4);
      padding: 16px;
      border-radius: 60px;
    }

    .reply-indicator {
      background: rgba(45, 62, 255, 0.3);
      padding: 6px 12px;
      border-radius: 30px;
      font-size: 0.75rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-right: 10px;
    }

    .cancel-reply {
      background: none;
      border: none;
      color: #ff8888;
      cursor: pointer;
      font-size: 1rem;
    }

    .text-input {
      flex: 1;
      padding: 12px 20px;
      border: 1px solid rgba(80, 110, 255, 0.4);
      border-radius: 40px;
      background: rgba(0, 0, 0, 0.5);
      color: white;
      font-size: 1rem;
      outline: none;
    }

    .action-btn {
      background: #334155;
      border: none;
      padding: 12px 20px;
      border-radius: 40px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .action-btn:hover {
      transform: scale(0.97);
    }

    .send-btn { background: #2d3eff; }
    .record-audio-btn { background: #ef4444; }
    .stop-record-btn { background: #dc2626; }
    .file-label { background: #6b7280; cursor: pointer; }
    .file-label:hover { background: #4b5563; }

    input[type="file"] { display: none; }

    .recording-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(239, 68, 68, 0.3);
      padding: 6px 12px;
      border-radius: 40px;
      font-size: 0.8rem;
    }

    .pulse-dot {
      width: 10px;
      height: 10px;
      background: red;
      border-radius: 50%;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .user-welcome {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background: rgba(45, 62, 255, 0.2);
      border-radius: 80px;
      margin-bottom: 20px;
    }

    .logout-btn {
      background: rgba(30, 41, 59, 0.8);
      border: none;
      padding: 8px 20px;
      border-radius: 40px;
      color: white;
      cursor: pointer;
    }

    .logout-btn:hover { background: #ef4444; }

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.9);
      backdrop-filter: blur(8px);
    }

    .modal-content {
      margin: auto;
      display: block;
      width: 90%;
      max-width: 800px;
      max-height: 90%;
      margin-top: 5%;
    }

    .close-modal {
      position: absolute;
      top: 20px;
      right: 35px;
      color: #fff;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
    }

    .close-modal:hover { color: #ff5555; }

    #modalImage, #modalVideo, #modalAudio, #modalOther { display: none; max-width: 100%; max-height: 80vh; margin: auto; }
    .modal-file-info { text-align: center; color: white; margin-top: 20px; font-size: 0.9rem; }

    @media (max-width: 650px) {
      .hexer-glow { font-size: 2.5rem; letter-spacing: 4px; }
      .input-bar { flex-direction: column; }
      .action-btn { width: 100%; justify-content: center; }
      .message-bubble { max-width: 95%; }
      .inline-audio { max-width: 100%; }
    }
  </style>
</head>
<body>

<div class="universe-card" id="appRoot">
  <div class="hexer-brand">
    <div class="hexer-glow">HEXER</div>
    <div class="hexer-tag">✦ PERSISTENT REAL-TIME CHAT ✦</div>
  </div>

  <div id="fileModal" class="modal">
    <span class="close-modal">&times;</span>
    <div class="modal-content" style="text-align: center;">
      <img id="modalImage" alt="File preview">
      <video id="modalVideo" controls></video>
      <audio id="modalAudio" controls></audio>
      <div id="modalOther" style="color: white; padding: 40px; background: #1e1e2e; border-radius: 20px;">
        <p>📄 Cannot preview this file type</p>
        <a id="downloadLink" href="#" download style="color: #88ddff; margin-top: 10px; display: inline-block;">Click to download</a>
      </div>
      <div class="modal-file-info" id="modalFileInfo"></div>
    </div>
  </div>

  <div id="authPanel" class="auth-container">
    <div class="auth-tabs">
      <button class="tab-btn active" id="loginTab">🔐 LOGIN</button>
      <button class="tab-btn" id="registerTab">📝 REGISTER</button>
    </div>
    <div id="loginForm">
      <div class="auth-form">
        <div class="input-group"><label>⚡ USERNAME</label><input type="text" id="loginUsername"></div>
        <div class="input-group"><label>🔒 PASSWORD</label><input type="password" id="loginPassword"></div>
        <button class="auth-btn" id="doLoginBtn">⟡ ENTER HEXER ⟡</button>
        <div id="loginMessage" class="auth-message">Demo: "hexer_user" / "hexpass"</div>
      </div>
    </div>
    <div id="registerForm" style="display: none;">
      <div class="auth-form">
        <div class="input-group"><label>✨ USERNAME</label><input type="text" id="regUsername" placeholder="min 3 chars"></div>
        <div class="input-group"><label>🔐 PASSWORD</label><input type="password" id="regPassword" placeholder="min 4 chars"></div>
        <div class="input-group"><label>✓ CONFIRM</label><input type="password" id="regConfirm"></div>
        <button class="auth-btn" id="doRegisterBtn">⟡ REGISTER & GET ID ⟡</button>
        <div id="registerMessage" class="auth-message">Registration creates your 6-char ID</div>
      </div>
    </div>
  </div>

  <div id="mainApp" style="display: none; padding: 0 24px 32px 24px;">
    <div class="user-welcome">
      <span>👤 <strong id="activeUsername"><fontcolor="white">User</font></strong> · <span id="displayOwnIdSpan" style="background:#9e96eeaa; padding:4px 12px; border-radius:40px; font-family:monospace;">ID: ---</span></span>
      <button class="logout-btn" id="logoutBtn">🚪 EXIT</button>
    </div>

    <div id="recipientSelector" class="recipient-section">
      <div class="recipient-title">📡 SELECT FRIEND TO CHAT</div>
      <div class="recipient-fields">
        <div class="input-group"><label>👤 FRIEND NAME</label><input type="text" id="targetName" placeholder="Friend's name"></div>
        <div class="input-group"><label>🆔 FRIEND ID (6 chars)</label><input type="text" id="targetId" maxlength="6" placeholder="A1B2C3" style="text-transform: uppercase;"></div>
      </div>
      <div id="targetValidationMsg" class="validation-status"></div>
      <button class="auth-btn" id="communicateBtn">⟡ START CHAT ⟡</button>
    </div>

    <div id="commsInterface" class="comms-container">
      <div class="chat-header">
        <span>💬 CHATTING WITH <strong id="chatTargetName">—</strong> (ID: <span id="chatTargetId">—</span>) <span id="onlineStatus" class="offline-badge">● Offline</span></span>
        <span id="recordingStatus" style="font-size: 0.8rem;"></span>
      </div>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="input-bar" id="inputBar">
        <div id="replyPreview" style="display: none;" class="reply-indicator">
          <span>↩️ Replying to: <span id="replyPreviewText"></span></span>
          <button id="cancelReplyBtn" class="cancel-reply">✕</button>
        </div>
        <input type="text" id="messageInput" class="text-input" placeholder="Type a message..." autocomplete="off">
        <button id="sendTextBtn" class="action-btn send-btn">📨 SEND</button>
        <button id="recordAudioBtn" class="action-btn record-audio-btn">🎙️ RECORD</button>
        <button id="stopAudioBtn" class="action-btn stop-record-btn" style="display: none;">⏹️ STOP</button>
        <label class="action-btn file-label">📎 FILE<input type="file" id="fileInput"></label>
      </div>
    </div>
  </div>
</div>

<script>
  // PERSISTENT SESSION MANAGEMENT
  const SESSION_KEY = 'hexer_current_session';
  
  // Database functions
  function generateHexId() {
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    let id = '';
    for (let i = 0; i < 6; i++) id += chars[Math.floor(Math.random() * chars.length)];
    return id;
  }

  function initStorage() {
    if (!localStorage.getItem('hexer_users')) {
      const defaultUsers = { "hexer_user": { password: "hexpass", hexId: "X7K2M9" } };
      localStorage.setItem('hexer_users', JSON.stringify(defaultUsers));
    }
  }
  initStorage();

  function getUsersDB() { return JSON.parse(localStorage.getItem('hexer_users') || '{}'); }
  function saveUsersDB(users) { localStorage.setItem('hexer_users', JSON.stringify(users)); }

  function doesRecipientIdExist(recipientId) {
    const users = getUsersDB();
    for (let username in users) {
      if (users[username].hexId === recipientId) return true;
    }
    return false;
  }

  function registerNewUser(username, password) {
    const users = getUsersDB();
    if (username.length < 3) return { ok: false, msg: "Username min 3 chars" };
    if (password.length < 4) return { ok: false, msg: "Password min 4 chars" };
    if (users[username]) return { ok: false, msg: "Username exists" };
    const newId = generateHexId();
    users[username] = { password: password, hexId: newId };
    saveUsersDB(users);
    return { ok: true, msg: "Account created! Your HEXER ID: " + newId, hexId: newId };
  }

  function loginUser(username, password) {
    const users = getUsersDB();
    if (!users[username]) return { ok: false, msg: "User not found" };
    if (users[username].password !== password) return { ok: false, msg: "Wrong password" };
    return { ok: true, hexId: users[username].hexId };
  }

  // Save session to localStorage
  function saveSession(username, hexId) {
    const sessionData = { username, hexId, timestamp: Date.now() };
    localStorage.setItem(SESSION_KEY, JSON.stringify(sessionData));
  }

  // Clear session
  function clearSession() {
    localStorage.removeItem(SESSION_KEY);
  }

  // Get saved session
  function getSavedSession() {
    const sessionData = localStorage.getItem(SESSION_KEY);
    if (sessionData) {
      try {
        return JSON.parse(sessionData);
      } catch(e) { return null; }
    }
    return null;
  }

  // WebSocket and chat variables
  let ws = null;
  let currentUserData = null;
  let currentFriendId = null;
  let onlineStatus = false;
  let activeReply = null;

  // Audio recording variables
  let mediaRecorder = null;
  let audioChunks = [];
  let stream = null;
  let isAudioRecording = false;

  // DOM Elements
  const authPanel = document.getElementById('authPanel');
  const mainApp = document.getElementById('mainApp');
  const loginFormDiv = document.getElementById('loginForm');
  const registerFormDiv = document.getElementById('registerForm');
  const loginTab = document.getElementById('loginTab');
  const registerTab = document.getElementById('registerTab');
  const doLoginBtn = document.getElementById('doLoginBtn');
  const doRegisterBtn = document.getElementById('doRegisterBtn');
  const loginMessageDiv = document.getElementById('loginMessage');
  const registerMessageDiv = document.getElementById('registerMessage');
  const activeUsernameSpan = document.getElementById('activeUsername');
  const displayOwnIdSpan = document.getElementById('displayOwnIdSpan');
  const logoutBtn = document.getElementById('logoutBtn');
  const recipientSelector = document.getElementById('recipientSelector');
  const commsInterface = document.getElementById('commsInterface');
  const targetNameInput = document.getElementById('targetName');
  const targetIdInput = document.getElementById('targetId');
  const targetValidationMsg = document.getElementById('targetValidationMsg');
  const communicateBtn = document.getElementById('communicateBtn');
  const chatTargetName = document.getElementById('chatTargetName');
  const chatTargetId = document.getElementById('chatTargetId');
  const onlineStatusSpan = document.getElementById('onlineStatus');
  const chatMessagesDiv = document.getElementById('chatMessages');
  const messageInput = document.getElementById('messageInput');
  const sendTextBtn = document.getElementById('sendTextBtn');
  const recordAudioBtn = document.getElementById('recordAudioBtn');
  const stopAudioBtn = document.getElementById('stopAudioBtn');
  const fileInput = document.getElementById('fileInput');
  const recordingStatusSpan = document.getElementById('recordingStatus');
  const replyPreview = document.getElementById('replyPreview');
  const replyPreviewText = document.getElementById('replyPreviewText');
  const cancelReplyBtn = document.getElementById('cancelReplyBtn');

  // WebSocket connection
  function connectWebSocket(userId, friendId) {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.close();
    }
    ws = new WebSocket('wss://ws.postman-echo.com/raw');
    
    ws.onopen = () => {
      onlineStatusSpan.className = 'online-badge';
      onlineStatusSpan.innerHTML = '● Online';
      onlineStatus = true;
      ws.send(JSON.stringify({ type: 'join', userId: userId, friendId: friendId, room: `room_${[userId, friendId].sort().join('_')}` }));
    };
    
    ws.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        if (data.type === 'message') {
          addMessageToChat(data.text, 'received', data.timestamp, data.replyTo);
          markMessagesAsSeen();
        } else if (data.type === 'status') {
          if (data.online) {
            onlineStatusSpan.className = 'online-badge';
            onlineStatusSpan.innerHTML = '● Online';
          } else {
            onlineStatusSpan.className = 'offline-badge';
            onlineStatusSpan.innerHTML = '● Offline';
          }
        }
      } catch (e) {
        if (event.data.startsWith('{')) return;
        addMessageToChat(event.data, 'received', new Date().toLocaleTimeString());
      }
    };
    
    ws.onclose = () => {
      onlineStatusSpan.className = 'offline-badge';
      onlineStatusSpan.innerHTML = '● Offline';
      onlineStatus = false;
    };
    
    ws.onerror = () => {
      onlineStatusSpan.className = 'offline-badge';
      onlineStatusSpan.innerHTML = '● Disconnected';
    };
  }

  function sendMessage(text, type = 'text', replyTo = null) {
    if (ws && ws.readyState === WebSocket.OPEN && currentFriendId) {
      const message = {
        type: 'message',
        text: text,
        messageType: type,
        replyTo: replyTo,
        timestamp: new Date().toLocaleTimeString(),
        sender: currentUserData?.username,
        senderId: currentUserData?.hexId,
        recipientId: currentFriendId
      };
      ws.send(JSON.stringify(message));
      addMessageToChat(text, 'sent', message.timestamp, replyTo);
    } else {
      addMessageToChat('⚠️ Not connected. Trying to reconnect...', 'received', new Date().toLocaleTimeString());
      setTimeout(() => connectWebSocket(currentUserData.hexId, currentFriendId), 1000);
    }
  }

  function addMessageToChat(text, direction, timestamp, replyTo = null) {
    const messageDiv = document.createElement('div');
    const msgId = 'msg_' + Date.now() + '_' + Math.random().toString(36).substr(2, 8);
    messageDiv.className = `message-bubble message-${direction}`;
    messageDiv.setAttribute('data-message-id', msgId);
    
    let content = '';
    if (replyTo) {
      content += `<div class="reply-preview"><span>↩️ Replying to:</span> ${replyTo.text.substring(0, 50)}</div>`;
    }
    content += text;
    content += `<div class="message-time">${timestamp || new Date().toLocaleTimeString()}</div>`;
    
    messageDiv.innerHTML = content;
    
    if (direction === 'received') {
      const seenSpan = document.createElement('div');
      seenSpan.className = 'seen-status';
      seenSpan.innerHTML = '✓ Seen';
      messageDiv.appendChild(seenSpan);
    } else {
      const seenSpan = document.createElement('div');
      seenSpan.className = 'seen-status';
      seenSpan.innerHTML = '✓ Sent';
      messageDiv.appendChild(seenSpan);
    }
    
    const actionsDiv = document.createElement('div');
    actionsDiv.className = 'message-actions';
    
    const replyBtn = document.createElement('button');
    replyBtn.innerHTML = '↩️ Reply';
    replyBtn.className = 'action-icon';
    replyBtn.onclick = () => {
      activeReply = { text: text, messageId: msgId };
      replyPreviewText.innerText = text.length > 40 ? text.substring(0, 40) + '...' : text;
      replyPreview.style.display = 'flex';
      messageInput.focus();
    };
    
    const deleteBtn = document.createElement('button');
    deleteBtn.innerHTML = '✕ Delete';
    deleteBtn.className = 'action-icon delete-icon';
    deleteBtn.onclick = () => {
      messageDiv.remove();
    };
    
    actionsDiv.appendChild(replyBtn);
    actionsDiv.appendChild(deleteBtn);
    messageDiv.appendChild(actionsDiv);
    
    chatMessagesDiv.appendChild(messageDiv);
    chatMessagesDiv.scrollTop = chatMessagesDiv.scrollHeight;
  }

  function markMessagesAsSeen() {
    const receivedMessages = document.querySelectorAll('.message-received .seen-status');
    receivedMessages.forEach(el => {
      if (el.innerHTML !== '✓ Seen') el.innerHTML = '✓ Seen';
    });
  }

  function sendTextMessage() {
    const msg = messageInput.value.trim();
    if (!msg) return;
    sendMessage(msg, 'text', activeReply);
    messageInput.value = '';
    cancelReply();
  }

  function cancelReply() {
    activeReply = null;
    replyPreview.style.display = 'none';
    replyPreviewText.innerText = '';
  }

  async function startAudioRecording() {
    if (isAudioRecording) return;
    audioChunks = [];
    try {
      const micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      stream = micStream;
      let mime = '';
      for (const t of ['audio/webm', 'audio/mp4', 'audio/ogg']) {
        if (MediaRecorder.isTypeSupported(t)) { mime = t; break; }
      }
      mediaRecorder = new MediaRecorder(stream, mime ? { mimeType: mime } : {});
      mediaRecorder.ondataavailable = (e) => { if (e.data.size) audioChunks.push(e.data); };
      mediaRecorder.onstop = () => {
        if (audioChunks.length) {
          const audioBlob = new Blob(audioChunks, { type: mime || 'audio/webm' });
          const audioName = `voice_${new Date().toLocaleTimeString().replace(/:/g, '-')}.webm`;
          sendMessage(`🎵 Voice message (${(audioBlob.size/1024).toFixed(1)} KB)`, 'audio', activeReply);
          cancelReply();
        }
        if (stream) {
          stream.getTracks().forEach(track => track.stop());
          stream = null;
        }
        isAudioRecording = false;
        recordAudioBtn.style.display = 'inline-flex';
        stopAudioBtn.style.display = 'none';
        recordingStatusSpan.innerHTML = '';
      };
      mediaRecorder.start(1000);
      isAudioRecording = true;
      recordAudioBtn.style.display = 'none';
      stopAudioBtn.style.display = 'inline-flex';
      recordingStatusSpan.innerHTML = '<span class="recording-indicator"><span class="pulse-dot"></span> Recording...</span>';
    } catch (err) {
      alert("Microphone access denied.");
      recordAudioBtn.style.display = 'inline-flex';
      stopAudioBtn.style.display = 'none';
    }
  }

  function stopAudioRecording() {
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      mediaRecorder.stop();
    }
  }

  function handleFileUpload(event) {
    const file = event.target.files[0];
    if (!file) return;
    const fileName = file.name;
    const fileSize = (file.size / 1024).toFixed(1);
    sendMessage(`📎 File: ${fileName} (${fileSize} KB)`, 'file', activeReply);
    cancelReply();
    fileInput.value = '';
  }

  function validateTargetId() {
    const idValue = targetIdInput.value.trim().toUpperCase();
    if (idValue.length === 0) { targetValidationMsg.innerHTML = ''; return false; }
    if (idValue.length !== 6) {
      targetValidationMsg.innerHTML = '<span class="status-unavailable">❌ ID must be exactly 6 characters</span>';
      return false;
    }
    const exists = doesRecipientIdExist(idValue);
    if (!exists) {
      targetValidationMsg.innerHTML = '<span class="status-unavailable">❌ Unavailable! ID not registered</span>';
      return false;
    } else {
      targetValidationMsg.innerHTML = '<span class="status-available">✓ Valid friend ID</span>';
      return true;
    }
  }

  function startCommunication() {
    const name = targetNameInput.value.trim();
    let id = targetIdInput.value.trim().toUpperCase();
    if (!name) { targetValidationMsg.innerHTML = '<span class="status-unavailable">❌ Enter friend name</span>'; return; }
    if (!id || id.length !== 6) { targetValidationMsg.innerHTML = '<span class="status-unavailable">❌ Valid 6-char ID required</span>'; return; }
    if (!doesRecipientIdExist(id)) { targetValidationMsg.innerHTML = '<span class="status-unavailable">❌ Unavailable! ID not found</span>'; return; }

    currentFriendId = id;
    chatTargetName.innerText = name;
    chatTargetId.innerText = id;
    chatMessagesDiv.innerHTML = '';
    
    connectWebSocket(currentUserData.hexId, id);
    
    recipientSelector.style.display = 'none';
    commsInterface.style.display = 'block';
    
    addMessageToChat(`🔐 Connected to ${name} (${id}) - Real-time chat active!`, 'received', new Date().toLocaleTimeString());
  }

  function logout() {
    if (ws) ws.close();
    if (mediaRecorder && mediaRecorder.state === 'recording') try { mediaRecorder.stop(); } catch(e) {}
    if (stream) stream.getTracks().forEach(t => t.stop());
    currentUserData = null;
    currentFriendId = null;
    clearSession();
    authPanel.style.display = 'block';
    mainApp.style.display = 'none';
    recipientSelector.style.display = 'block';
    commsInterface.style.display = 'none';
    targetNameInput.value = '';
    targetIdInput.value = '';
    targetValidationMsg.innerHTML = '';
    cancelReply();
  }

  function showAuthScreen() { 
    authPanel.style.display = 'block'; 
    mainApp.style.display = 'none'; 
  }
  
  function enterMainApp(username, hexId) {
    currentUserData = { username, hexId };
    activeUsernameSpan.innerText = username;
    displayOwnIdSpan.innerHTML = `ID: ${hexId}`;
    recipientSelector.style.display = 'block';
    commsInterface.style.display = 'none';
    targetNameInput.value = '';
    targetIdInput.value = '';
    targetValidationMsg.innerHTML = '';
    authPanel.style.display = 'none';
    mainApp.style.display = 'block';
    cancelReply();
  }

  function handleLoginAndSaveSession() {
    const user = document.getElementById('loginUsername').value.trim();
    const pwd = document.getElementById('loginPassword').value;
    if (!user || !pwd) { loginMessageDiv.className = 'auth-message error-msg'; loginMessageDiv.innerText = 'Enter credentials'; return; }
    const res = loginUser(user, pwd);
    if (res.ok) {
      saveSession(user, res.hexId);
      enterMainApp(user, res.hexId);
    } else {
      loginMessageDiv.className = 'auth-message error-msg';
      loginMessageDiv.innerText = res.msg;
    }
  }

  function handleRegisterAndLogin() {
    const user = document.getElementById('regUsername').value.trim();
    const pwd = document.getElementById('regPassword').value;
    const confirm = document.getElementById('regConfirm').value;
    if (!user || !pwd || !confirm) { registerMessageDiv.className = 'auth-message error-msg'; registerMessageDiv.innerText = 'All fields required'; return; }
    if (pwd !== confirm) { registerMessageDiv.className = 'auth-message error-msg'; registerMessageDiv.innerText = 'Passwords mismatch'; return; }
    const reg = registerNewUser(user, pwd);
    if (reg.ok) {
      registerMessageDiv.className = 'auth-message success-msg';
      registerMessageDiv.innerText = `✅ ${reg.msg}`;
      setTimeout(() => {
        const loginRes = loginUser(user, pwd);
        if (loginRes.ok) {
          saveSession(user, loginRes.hexId);
          enterMainApp(user, loginRes.hexId);
        } else {
          showAuthScreen();
        }
      }, 1000);
    } else {
      registerMessageDiv.className = 'auth-message error-msg';
      registerMessageDiv.innerText = reg.msg;
    }
  }

  function switchTab(tab) {
    if (tab === 'login') {
      loginTab.classList.add('active'); registerTab.classList.remove('active');
      loginFormDiv.style.display = 'block'; registerFormDiv.style.display = 'none';
    } else {
      registerTab.classList.add('active'); loginTab.classList.remove('active');
      loginFormDiv.style.display = 'none'; registerFormDiv.style.display = 'block';
    }
  }

  // CHECK FOR EXISTING SESSION ON PAGE LOAD
  function checkExistingSession() {
    const savedSession = getSavedSession();
    if (savedSession && savedSession.username && savedSession.hexId) {
      // Verify that the user still exists in database
      const users = getUsersDB();
      if (users[savedSession.username] && users[savedSession.username].hexId === savedSession.hexId) {
        enterMainApp(savedSession.username, savedSession.hexId);
        return true;
      } else {
        clearSession();
        return false;
      }
    }
    return false;
  }

  // Event listeners
  targetIdInput.addEventListener('input', function(e) { e.target.value = e.target.value.toUpperCase(); validateTargetId(); });
  communicateBtn.addEventListener('click', startCommunication);
  sendTextBtn.addEventListener('click', sendTextMessage);
  messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendTextMessage(); });
  recordAudioBtn.addEventListener('click', startAudioRecording);
  stopAudioBtn.addEventListener('click', stopAudioRecording);
  fileInput.addEventListener('change', handleFileUpload);
  logoutBtn.addEventListener('click', logout);
  doLoginBtn.addEventListener('click', handleLoginAndSaveSession);
  doRegisterBtn.addEventListener('click', handleRegisterAndLogin);
  loginTab.addEventListener('click', () => switchTab('login'));
  registerTab.addEventListener('click', () => switchTab('register'));
  cancelReplyBtn.addEventListener('click', cancelReply);

  // Modal setup
  const modal = document.getElementById('fileModal');
  const closeModalBtn = document.querySelector('.close-modal');
  closeModalBtn.onclick = () => { modal.style.display = 'none'; };
  window.onclick = (event) => { if (event.target === modal) modal.style.display = 'none'; };

  // Initialize - check for existing session first
  const hasSession = checkExistingSession();
  if (!hasSession) {
    showAuthScreen();
  }

  if (!window.MediaRecorder) { alert("Audio recording not supported."); recordAudioBtn.disabled = true; }
</script>
</body>
